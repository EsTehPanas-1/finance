<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance</title>
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1ee; --card: #ffffff; --ink: #15201c; --muted: #66736d; --line: #dce2de; --soft: #f4f6f4;
    --accent: #1f6f5c; --accent-ink: #ffffff; --danger: #b3261e;
    --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1513; --card: #18201d; --ink: #e9efec; --muted: #8e9a95; --line: #2a3430; --soft: #1d2622;
      --accent: #4fb89d; --accent-ink: #06201a; --danger: #f2877f; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--font); overflow: hidden;
    display: grid; grid-template-rows: auto 1fr; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Top bar: the two pages as one segmented switch, settings on the right, balanced by a spacer */
  .bar { padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: center; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; }
  .tabs button { height: 36px; padding: 0 6px; border: 0; background: none; border-radius: 10px; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; white-space: nowrap;
    transition: background-color .2s, color .2s; }
  .tabs button span { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: var(--soft); color: var(--muted);
    transition: background-color .2s, color .2s; }
  .tabs button.on { background: var(--accent); color: var(--accent-ink); }
  .tabs button.on span { background: rgba(255,255,255,.2); color: var(--accent-ink); }
  .gear { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    display: grid; place-items: center; padding: 0; }

  /* Pages: each app stays loaded, so switching is instant */
  main { position: relative; min-height: 0; overflow: hidden; }
  .page { position: absolute; inset: 0; visibility: hidden; }
  .page.on { visibility: visible; }
  .page iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }

  /* Cards for setup / problems */
  .cover { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); overflow: auto; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 24px; text-align: center; }
  .card h2 { font-size: 18px; margin: 0 0 8px; }
  .card p { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .card ol { text-align: left; color: var(--muted); font-size: 14px; padding-left: 20px; margin: 0 0 16px; }
  .card input { width: 100%; height: 48px; border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 0 14px; font-size: 14px; font-weight: 600; }
  .card input:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btns.one { grid-template-columns: 1fr; }
  .btn { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); font-weight: 700; display: grid; place-items: center; text-decoration: none; color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin: 8px 0 0; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); margin: 0 auto 12px; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Swiping between the two apps slides the new page in */
  .page.on.from-right { animation: fromR .26s cubic-bezier(.2,.8,.2,1); }
  .page.on.from-left { animation: fromL .26s cubic-bezier(.2,.8,.2,1); }
  @keyframes fromR { from { transform: translateX(30%); opacity: 0; } }
  @keyframes fromL { from { transform: translateX(-30%); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .page.on { animation: none !important; } .spin { animation-duration: 3s; } }

  /* Settings sheet */
  #settings { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  #settings.show { display: flex; }
  #settings .card { border-radius: 22px 22px 0 0; max-width: 480px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); text-align: left; }
  #settings label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; }
  #settings h2 { text-align: center; }
  #settings .hint { color: var(--muted); font-size: 13px; margin: 0; }
  #settings select { width: 100%; height: 44px; border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 0 12px; font: inherit; font-weight: 600; color: var(--ink); }
  .lockrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 700; }
  .lockrow small { color: var(--muted); font-weight: 600; }
  .btns.three { grid-template-columns: 1fr 1fr; }
  .btn:disabled { opacity: .5; }

  /* Offline entry */
  .cover.off { place-items: start center; }
  .off .card { text-align: left; }
  .off .card h2, .off .card > p { text-align: center; }
  .off label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 8px; }
  .ochips { display: grid; gap: 8px; }
  .ochip { min-width: 0; height: 42px; padding: 0 6px; border: 1px solid var(--line); background: var(--soft); border-radius: 12px;
    font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .ochip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .oquick { display: flex; flex-wrap: wrap; gap: 8px; }
  .oquick button { height: 36px; padding: 0 12px; border: 1px solid var(--line); background: var(--soft); border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink); }
  .oquick span { color: var(--muted); margin-left: 6px; }
  .off input.amt { height: 60px; font-size: 28px; font-weight: 800; text-align: center; }
  .off .calc { text-align: center; color: var(--muted); font-size: 13px; font-weight: 700; margin-top: 6px; }
  .off .calc:empty { display: none; }
  .plist { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 8px; }
  .plist h3 { font-size: 13px; color: var(--muted); margin: 8px 0; text-align: center; }
  .pitem { display: grid; grid-template-columns: 1fr auto 32px; gap: 2px 8px; align-items: center; padding: 8px 0; font-size: 14px; font-weight: 600; }
  .pitem + .pitem { border-top: 1px dashed var(--line); }
  .pitem small { grid-column: 1 / 3; color: var(--muted); font-size: 12px; }
  .pitem small.bad { color: var(--danger); }
  .pitem button { grid-column: 3; grid-row: 1 / 3; width: 32px; height: 32px; border: 0; background: none; color: var(--muted); font-size: 20px; border-radius: 8px; }
  #settings .plist { margin-top: 0; border-top: 0; padding-top: 0; }
  #settings .plist h3 { display: none; }
  #pend { display: none; max-width: 480px; margin: 8px auto 0; width: 100%; height: 32px; border: 1px solid var(--line); background: var(--card);
    border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--muted); align-items: center; justify-content: center; gap: 6px; }
  #pend.show { display: flex; }
  #pend.bad { color: var(--danger); border-color: var(--danger); }
  #stoast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 15;
    max-width: calc(100% - 32px); text-align: center; }
  #stoast.show { opacity: 1; }

  /* Lock screen */
  #lock { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column; align-items: center;
    justify-content: center; padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); overflow: auto; }
  #lock.show { display: flex; }
  #lock img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 16px; }
  #lock h2 { font-size: 19px; margin: 0 0 6px; text-align: center; }
  #lock .msg { color: var(--muted); font-size: 14px; min-height: 21px; margin: 0 0 20px; text-align: center; max-width: 320px; }
  #lock .msg.bad { color: var(--danger); font-weight: 600; }
  .dots { display: flex; gap: 14px; height: 16px; margin-bottom: 32px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); transition: background-color .12s, border-color .12s; }
  .dots i.on { background: var(--ink); border-color: var(--ink); }
  .dots.shake { animation: shake .36s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 28px; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink);
    font-size: 26px; font-weight: 700; display: grid; place-items: center; padding: 0; transition: background-color .12s; }
  .pad button:active { background: var(--line); }
  .pad button.plain { background: none; color: var(--muted); }
  .pad button.ok { background: var(--accent); color: var(--accent-ink); }
  .pad button:disabled { visibility: hidden; }
  #lock .under { margin-top: 24px; background: none; border: 0; color: var(--muted); font-weight: 600; font-size: 14px; padding: 8px 12px; }
  #lock .help { color: var(--muted); font-size: 13px; text-align: center; max-width: 320px; margin: 16px 0 0; }
  #settings .open { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; display: inline-block; margin-top: 6px; }
</style>
</head>
<body>
<div class="bar"><div class="in">
  <div class="tabs" role="tablist" id="tabs"></div>
  <button class="gear" id="gearBtn" aria-label="Settings" title="Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div><button id="pend" type="button"></button></div>
<main id="pages"></main>
<div id="stoast" role="status"></div>
<div id="settings" role="dialog" aria-modal="true" aria-label="Settings"><div class="card" id="settingsCard"></div></div>
<div id="lock" role="dialog" aria-modal="true" aria-label="Locked"></div>

<script src="config.js"></script>
<script>
const APPS = window.FINANCE_APPS || [];
const STORE = 'finance-site-v1';
const LOAD_TIMEOUT = 20000;
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach((c) => { if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}

// Saved on this phone: links you pasted and the page you used last.
function readStore() { try { return JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { return {}; } }
function writeStore(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) { /* storage off: fine */ } }
const store = readStore();
store.urls = store.urls || {};
const urlOf = (app) => store.urls[app.id] || app.url || '';
const validUrl = (u) => /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\/exec\/?$/.test(String(u).trim());

// ---------- pages ----------
const state = {};   // id -> { page, frame, status: 'none' | 'loading' | 'ready', timer }
let current = null;

function buildTabs() {
  $('#tabs').replaceChildren(...APPS.map((app) => h('button', {
    role: 'tab', 'aria-selected': String(app.id === current), class: app.id === current ? 'on' : '',
    onclick: () => go(app.id)
  }, app.name, h('span', null, app.badge))));
}

function go(id) {
  if (!APPS.some((a) => a.id === id)) id = APPS[0].id;
  const from = APPS.findIndex((a) => a.id === current), to = APPS.findIndex((a) => a.id === id);
  current = id;
  store.last = id; writeStore(store);
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  buildTabs();
  APPS.forEach((app) => {
    ensurePage(app);
    const pg = state[app.id].page;
    pg.classList.remove('from-left', 'from-right');
    pg.classList.toggle('on', app.id === id);
    if (app.id === id && from >= 0 && from !== to) { void pg.offsetWidth; pg.classList.add(to > from ? 'from-right' : 'from-left'); }
  });
  start(APPS.find((a) => a.id === id));
  // Load the other page quietly once this one is up, so switching later is instant.
  setTimeout(() => APPS.forEach((a) => { if (a.id !== id) start(a); }), 2500);
}

function ensurePage(app) {
  if (state[app.id]) return;
  const page = h('section', { class: 'page', role: 'tabpanel', 'aria-label': app.name });
  $('#pages').append(page);
  state[app.id] = { page, frame: null, status: 'none', timer: null };
}

// Opens the app inside its page (once).
function start(app, force) {
  const st = state[app.id];
  const url = urlOf(app);
  if (!validUrl(url)) { showSetup(app); return; }
  if (!online()) { showOffline(app); return; }
  if (st.frame && !force) return;
  st.offline = false;
  st.page.replaceChildren();
  st.status = 'none';
  const frame = h('iframe', { src: url.trim(), title: app.name, allow: 'clipboard-write', referrerpolicy: 'no-referrer-when-downgrade' });
  const cover = h('div', { class: 'cover' }, h('div', { class: 'card' }, h('div', { class: 'spin' }), h('p', { style: 'margin:0' }, 'Opening ' + app.name + '…')));
  st.frame = frame;
  st.cover = cover;
  st.page.append(frame, cover);
  // The app itself shows "Loading your sheet…"; keep our cover only briefly in case Google shows nothing.
  frame.addEventListener('load', () => { setTimeout(() => { if (st.cover === cover && st.status !== 'none') hideCover(st); }, 0); });
  clearTimeout(st.timer);
  st.timer = setTimeout(() => { if (st.frame === frame && st.status === 'none') { if (online()) showProblem(app); else showOffline(app); } }, LOAD_TIMEOUT);
}
function hideCover(st) { if (st.cover) { st.cover.remove(); st.cover = null; } }

// The app tells us when it is running inside the page (it sends { financeApp: 'loading' | 'ready' }).
function containsWindow(win, target, depth) {
  if (!win) return false;
  if (win === target) return true;
  if (depth > 4) return false;
  try { for (let i = 0; i < win.frames.length; i++) if (containsWindow(win.frames[i], target, depth + 1)) return true; } catch (e) { /* ignore */ }
  return false;
}
window.addEventListener('message', (ev) => {
  const d = ev.data;
  if (!d || typeof d !== 'object' || !d.financeApp) return;
  const app = APPS.find((a) => state[a.id] && state[a.id].frame && containsWindow(state[a.id].frame.contentWindow, ev.source, 0));
  if (!app) return;
  if (d.financeApp === 'swipe') {
    if (locked || app.id !== current) return;
    const j = APPS.findIndex((a) => a.id === current) + (d.dir === 'left' ? 1 : -1);
    if (j >= 0 && j < APPS.length) go(APPS[j].id);
    return;
  }
  if (onAppMessage(app, d, ev.source)) return;
  const st = state[app.id];
  st.status = d.financeApp === 'ready' ? 'ready' : (st.status === 'ready' ? 'ready' : 'loading');
  clearTimeout(st.timer);
  hideCover(st);
});

function showSetup(app) {
  const st = state[app.id];
  st.frame = null; st.status = 'none';
  const input = h('input', { type: 'url', inputmode: 'url', placeholder: 'https://script.google.com/macros/s/…/exec', autocomplete: 'off', value: urlOf(app) });
  const err = h('p', { class: 'err' });
  const save = () => {
    const v = input.value.trim();
    if (!validUrl(v)) { err.textContent = 'That doesn\'t look like a web app link. It should start with https://script.google.com/macros/s/ and end with /exec.'; return; }
    store.urls[app.id] = v; writeStore(store);
    start(app, true);
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
  st.page.replaceChildren(h('div', { class: 'cover' }, h('div', { class: 'card' },
    h('h2', null, 'Connect ' + app.name),
    h('p', null, 'Paste the web app link of your ' + app.name + ' sheet.'),
    h('ol', null,
      h('li', null, 'Open the sheet, then Extensions → Apps Script.'),
      h('li', null, 'Deploy → Manage deployments.'),
      h('li', null, 'Copy the Web app URL (it ends in /exec).')),
    input, err,
    h('div', { class: 'btns one' }, h('button', { class: 'btn primary', onclick: save }, 'Save')))));
}

function showProblem(app) {
  const st = state[app.id];
  const url = urlOf(app).trim();
  st.page.querySelectorAll('.cover').forEach((c) => c.remove());
  st.cover = h('div', { class: 'cover' }, h('div', { class: 'card' },
    h('h2', null, app.name + ' didn\'t open here'),
    h('p', null, 'Usually one of these:'),
    h('ol', null,
      h('li', null, 'You\'re not signed in to Google in this browser. Tap "Open directly", sign in, then come back and tap "Try again".'),
      h('li', null, 'The latest Code.gs (with the line that allows this site) isn\'t deployed yet: Deploy → Manage deployments → ✎ → New version → Deploy.'),
      h('li', null, 'The link is wrong. Check it under ⚙.')),
    h('div', { class: 'btns' },
      h('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener' }, 'Open directly'),
      h('button', { class: 'btn primary', onclick: () => start(app, true) }, 'Try again'))));
  st.page.append(st.cover);
}

// ---------- Offline entry ----------
// With no signal Google's pages can't open, so the site shows its own small form. Entries wait on
// this phone and are handed to the app (which writes them to your sheet) once you're back online.
store.meta = store.meta || {};
store.pending = store.pending || [];
store.pending.forEach((x) => { x.sent = false; });   // anything not confirmed last time is sent again (the app skips duplicates)
const OF = {};   // form state per app
const online = () => navigator.onLine !== false;
function stoast(msg) {
  const t = $('#stoast'); t.textContent = msg; t.className = 'show';
  clearTimeout(stoast.t); stoast.t = setTimeout(() => { t.className = ''; }, 2400);
}
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseAmt(raw, cur) {
  let x = String(raw || '').trim().replace(/[\s$]/g, '').replace(/^(HK|HKD|Rp|IDR)/i, '');
  const mult = /(k|rb|ribu)$/i.test(x) ? 1e3 : /(jt|juta)$/i.test(x) ? 1e6 : 1;
  x = x.replace(/(k|rb|ribu|jt|juta)$/i, '');
  if (mult > 1) { if (!/^\d+([.,]\d+)?$/.test(x)) return NaN; return Math.round(parseFloat(x.replace(',', '.')) * mult * 100) / 100; }
  if (cur === 'IDR' && /^\d{1,3}([.,]\d{3})+$/.test(x)) return Number(x.replace(/[.,]/g, ''));
  if (x.includes(',') && x.includes('.')) x = x.replace(/,/g, '');
  else if (/,\d{1,2}$/.test(x)) x = x.replace(',', '.');
  else x = x.replace(/,/g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(x) && !/^\.\d{1,2}$/.test(x)) return NaN;
  return Math.round(parseFloat(x) * 100) / 100;
}

function pendingList(items) {

    h('span', null, x.e.info), h('b', null, fmt(x.e.amount, x.e.currency || (store.meta[x.app] || {}).base)),

function saveOffline(app) {

function afterPendingChange(appId) {

// Hand waiting entries to an app that has just loaded.
function flushPending(app) {

    x.sent = true; delete x.error;

function onAppMessage(app, d, source) {

    const x = store.pending.find((y) => y.id === d.id);

// ---------- settings ----------

    APPS.map((app) => {

      return [h('label', null, app.name + ' link'), inputs[app.id],
        validUrl(urlOf(app)) ? h('a', { class: 'open', href: urlOf(app).trim(), target: '_blank', rel: 'noopener' }, 'Open ' + app.name + ' directly ↗') : null];
    }),
    err,

    h('div', { class: 'btns' },
      h('button', { class: 'btn', onclick: closeSettings }, 'Close'),

function closeSettings() { $('#settings').classList.remove('show'); }

$('#settings').addEventListener('click', (e) => { if (e.target.id === 'settings') closeSettings(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });

// ---------- App lock ----------
// A PIN (and optionally your fingerprint) when the app opens. It is a lock on this phone's copy
// of the site; your sheets stay protected by your Google account either way.
const LOCK_AFTER = [[0, 'Immediately'], [60, 'After 1 minute'], [300, 'After 5 minutes'], [900, 'After 15 minutes']];
const lockCfg = () => store.lock || null;
const enc = new TextEncoder();
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
async function pinHash(pin, salt) {
  const key = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(salt), iterations: 150000, hash: 'SHA-256' }, key, 256));
}
async function bioAvailable() {
  try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; }
}
let locked = false, hiddenAt = 0, bioBusy = false, unlockedAt = 0;
const L = { mode: 'unlock', entry: '', first: '', fails: 0, until: 0, msg: '', bad: false, help: false, onDone: null };
const ICON = {
  back: 'M21 6H9l-6 6 6 6h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zM16 10l-4 4M12 10l4 4',
  ok: 'M5 12.5l4.5 4.5L19 7.5',
  finger: 'M12 11v3a8 8 0 0 1-1 4M8 13.5V11a4 4 0 0 1 8 0v1M16 15.5c0 1.4-.2 2.8-.6 4M5.5 16c.3-1.2.5-2.5.5-4v-1a6 6 0 0 1 10.5-4M18 9.5c.3.8.5 1.6.5 2.5v1M9 20.5c.6-1.2 1-2.6 1-4'
};
function icon(d, size) {
  const sp = document.createElement('span');
  sp.innerHTML = '<svg viewBox="0 0 24 24" width="' + (size || 26) + '" height="' + (size || 26) + '" aria-hidden="true" style="display:block"><path d="' + d +
    '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return sp.firstChild;
}
function setInert(v) { document.querySelector('.bar').inert = v; $('#pages').inert = v; }
function showLock(mode, onDone) {
  Object.assign(L, { mode, entry: '', first: '', msg: '', bad: false, help: false, onDone: onDone || null });
  locked = mode === 'unlock';
  closeSettings();
  $('#lock').classList.add('show'); setInert(true);
  renderLock();
  if (mode === 'unlock' && lockCfg() && lockCfg().cred && !document.hidden) tryBio();
}
function hideLock() {
  $('#lock').classList.remove('show'); setInert(false);

  if (done) done();
}
function renderLock(shake) {

    Array.from({ length: n }, (_, i) => h('i', { class: i < L.entry.length ? 'on' : '' })));

    h('img', { src: 'icon-192.png', alt: '' }), h('h2', null, title), h('p', { class: 'msg' + (L.bad ? ' bad' : '') }, msg),

async function press(d) {

  const cfg = lockCfg();

    const tryPin = L.entry;
    if (await pinHash(tryPin, cfg.salt) === cfg.hash) { L.fails = 0; hideLock(); return; }
    L.fails++; L.entry = ''; L.bad = true;

async function submitSet() {

function lockSettings() {
  const cfg = lockCfg();
  if (!cfg) {
    return [h('label', null, 'App lock'),
      h('p', { class: 'hint' }, 'Ask for a PIN (or your fingerprint) when Finance opens.'),
      h('div', { class: 'btns one' }, h('button', { class: 'btn', onclick: () => showLock('set1', openSettings) }, 'Set up a PIN'))];
  }
  const after = h('select', { 'aria-label': 'Lock again', onchange: (e) => { store.lock.after = Number(e.target.value); writeStore(store); } },
    LOCK_AFTER.map(([v, t]) => h('option', { value: v, selected: v === cfg.after }, 'Lock again: ' + t.toLowerCase())));
  const bioBtn = h('button', { class: 'btn', onclick: () => {
    if (cfg.cred) { store.lock.cred = null; writeStore(store); openSettings(); } else enrolBio();
  } }, cfg.cred ? 'Stop using fingerprint' : 'Use fingerprint too');
  bioAvailable().then((ok) => { if (!ok && !cfg.cred) { bioBtn.disabled = true; bioBtn.textContent = 'No fingerprint on this device'; } });
  return [h('label', null, 'App lock'),
    h('div', { class: 'lockrow' }, h('span', null, 'On'), h('small', null, cfg.len + '-digit PIN' + (cfg.cred ? ' + fingerprint' : ''))),
    h('div', { style: 'margin-top:8px' }, after),
    h('div', { class: 'btns' }, h('button', { class: 'btn', onclick: () => showLock('set1', openSettings) }, 'Change PIN'),
      h('button', { class: 'btn', style: 'color:var(--danger)', onclick: () => { delete store.lock; writeStore(store); openSettings(); } }, 'Turn off')),
    h('div', { class: 'btns one' }, bioBtn)];
}
document.addEventListener('visibilitychange', () => {
  const cfg = lockCfg();
  if (!cfg || bioBusy) return;
  if (document.hidden) { if (!locked) hiddenAt = Date.now(); return; }
  if (locked) { if (cfg.cred) tryBio(); return; }

  else if (e.key === 'Backspace') { L.entry = L.entry.slice(0, -1); renderLock(); }
